name: Snapshot diario del catálogo

# snapshot.py sólo usa la librería estándar, así que este job no instala nada.
# Los tests viven en tests.yml y corren al hacer push. Mantenerlos separados
# evita que un fallo de código cueste un día de datos — lo único de este
# sistema que no se puede recuperar.

on:
  schedule:
    - cron: "15 6 * * *"     # 06:15 UTC = 08:15 en España (verano)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Snapshot
        run: python snapshot.py

      - name: Commit
        run: |
          git config user.name  "snapshot-bot"
          git config user.email "actions@github.com"
          git add data/raw
          if git diff --staged --quiet; then
            echo "sin cambios"
          else
            git commit -m "snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
